org.gradle.jvmargs=-Xmx2g
org.gradle.parallel=true
org.gradle.caching=true

# This network is slow (~0.5 MB/s) — give dependency resolution room instead
# of failing on the default short timeouts.
systemProp.http.connectionTimeout=180000
systemProp.http.socketTimeout=180000
systemProp.https.connectionTimeout=180000
systemProp.https.socketTimeout=180000
org.gradle.internal.repository.max.tentatives=5
org.gradle.internal.repository.initial.backoff=1000
