services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rojan
      POSTGRES_USER: rojan
      POSTGRES_PASSWORD: rojan
    ports:
      - "5432:5432"
    volumes:
      - rojan_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rojan -d rojan"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.8.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: rojan
      DB_USERNAME: rojan
      DB_PASSWORD: rojan
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set to a random string of at least 32 characters — see README.md}
      # LocalDevSmsProvider (Local OTP Test Support v1): opts into the dev-only
      # logging SMS adapter so OTP login/register is exercisable without real
      # MeliPayamak credentials - RealSmsProviderAdapter's own SMS_API_URL/
      # SMS_API_KEY/SMS_SENDER stay unset here on purpose, same as before this
      # change; this dev compose file is never used for production (see
      # docker-compose.prod.yml, which sets SPRING_PROFILES_ACTIVE=prod and
      # always requires real SMS credentials - LocalDevSmsProvider's own
      # @Profile("!test & !prod") means this property alone couldn't activate
      # it there even if copied by mistake).
      SMS_PROVIDER: local-dev
    # PASS INFRA-MEDIA-02: LocalMediaStorageProperties.storageRoot defaults to
    # /app/uploads (application.yml's MEDIA_STORAGE_ROOT default, matched by the
    # Dockerfile's own mkdir there) - LocalDiskMediaStorageAdapter writes every
    # real uploaded file there. Without a volume, that path was plain container
    # filesystem: every `up -d --force-recreate`/rebuild silently discarded all
    # previously-uploaded files while Postgres rows (MediaAsset, salon.logoMediaId,
    # etc.) survived untouched via rojan_postgres_data below - a real, confirmed
    # data loss (PASS MEDIA-PUBLIC-01's section M).
    #
    # A named volume, not a host bind mount: production's
    # ${ROJAN_DATA_ROOT:-/opt/rojan}/uploads bind mount is right for its prepared,
    # persistent VPS layout, but this is a Windows dev machine with no equivalent
    # host path - a named volume is the dev-appropriate persistence primitive here,
    # mirroring rojan_postgres_data's own existing convention one line below. Docker
    # owns the storage; salon/file count has zero effect on this configuration.
    volumes:
      - rojan_uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  rojan_postgres_data:
  rojan_uploads_data:
