# Main Nginx config for the ROJAN backend reverse proxy. Site-specific
# server blocks live in conf.d/rojan.conf — this file only sets the
# process-wide/http-wide defaults every site should share.

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;

    gzip on;
    gzip_types text/plain application/json application/javascript text/css;
    gzip_min_length 1024;

    # ROJAN_Backend's API is JSON-only, no file uploads defined in
    # API_CONTRACT.md yet — 2m is a deliberately small, easy-to-raise
    # default so an oversized request body fails fast at the proxy rather
    # than silently tying up a Tomcat worker thread.
    client_max_body_size 2m;

    include /etc/nginx/conf.d/*.conf;
}
