# ROJAN backend reverse proxy — HTTP (ACME challenge + redirect) and
# HTTPS (actual proxy to the app) server blocks.
#
# CHANGE_ME_DOMAIN must be replaced with the real domain name before first
# use — `docker/nginx/init-letsencrypt.sh` does this substitution for you
# as part of the documented bootstrap sequence in DEPLOYMENT.md. Do not
# edit the placeholder by hand and then also run the script; pick one.
#
# This file assumes a real Let's Encrypt certificate already exists at
# /etc/letsencrypt/live/CHANGE_ME_DOMAIN/ (or a temporary self-signed
# placeholder in the same location — see init-letsencrypt.sh) before Nginx
# starts. Nginx will refuse to start with `ssl_certificate` pointing at a
# path that doesn't exist yet, which is exactly why the placeholder-cert
# bootstrap step exists.

upstream rojan_app {
    server app:8080;
}

server {
    listen 80;
    listen [::]:80;
    server_name CHANGE_ME_DOMAIN;

    # Let's Encrypt HTTP-01 challenge — must be reachable over plain HTTP,
    # so this location is deliberately excluded from the HTTPS redirect
    # below.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Unauthenticated, cert-independent target for docker-compose's Nginx
    # container healthcheck — distinct from the app's own
    # /actuator/health so Nginx reports healthy even if the app is
    # temporarily down (that's a separate, already-monitored failure).
    location = /.well-known/healthcheck {
        default_type text/plain;
        return 200 "ok";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name CHANGE_ME_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/CHANGE_ME_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/CHANGE_ME_DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://rojan_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }
}

# --- Website (apps/website in ROJAN_Web) -----------------------------------
#
# Same HTTP (ACME challenge + redirect) / HTTPS (proxy) pair as the API
# server blocks above, pointed at rojanai.ir / www.rojanai.ir instead of a
# CHANGE_ME_DOMAIN placeholder — these are the real, final domains, not a
# per-environment substitution target like the API one.
#
# Requires its own Let's Encrypt certificate, issued for both names
# (e.g. `certbot certonly --webroot -w /var/www/certbot -d rojanai.ir -d
# www.rojanai.ir`), landing at /etc/letsencrypt/live/rojanai.ir/ (certbot
# uses the first -d name as the lineage directory). Nginx will refuse to
# start if that path doesn't exist yet — same bootstrap constraint the API
# block's own header comment describes.
#
# `website` resolves via Docker DNS on the backend_rojan_net network the
# website container joins (deploy/website/docker-compose.prod.yml in
# ROJAN_Web) — no host port involved.

upstream rojan_website {
    server website:3000;
}

server {
    listen 80;
    listen [::]:80;
    server_name rojanai.ir www.rojanai.ir;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name rojanai.ir www.rojanai.ir;

    ssl_certificate     /etc/letsencrypt/live/rojanai.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rojanai.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://rojan_website;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }
}
