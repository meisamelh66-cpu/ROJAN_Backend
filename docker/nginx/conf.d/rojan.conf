# ROJAN backend reverse proxy — HTTP (ACME challenge + redirect) and
# HTTPS (actual proxy to the app) server blocks.
#
# api.rojanai.ir must be replaced with the real domain name before first
# use — `docker/nginx/init-letsencrypt.sh` does this substitution for you
# as part of the documented bootstrap sequence in DEPLOYMENT.md. Do not
# edit the placeholder by hand and then also run the script; pick one.
#
# This file assumes a real Let's Encrypt certificate already exists at
# /etc/letsencrypt/live/api.rojanai.ir/ (or a temporary self-signed
# placeholder in the same location — see init-letsencrypt.sh) before Nginx
# starts. Nginx will refuse to start with `ssl_certificate` pointing at a
# path that doesn't exist yet, which is exactly why the placeholder-cert
# bootstrap step exists.

upstream rojan_app {
    server app:8080;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.rojanai.ir;

    # Let's Encrypt HTTP-01 challenge — must be reachable over plain HTTP,
    # so this location is deliberately excluded from the HTTPS redirect
    # below.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Unauthenticated, cert-independent target for docker-compose's Nginx
    # container healthcheck — distinct from the app's own
    # /actuator/health so Nginx reports healthy even if the app is
    # temporarily down (that's a separate, already-monitored failure).
    location = /.well-known/healthcheck {
        default_type text/plain;
        return 200 "ok";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.rojanai.ir;

    ssl_certificate     /etc/letsencrypt/live/api.rojanai.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.rojanai.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://rojan_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }
}
