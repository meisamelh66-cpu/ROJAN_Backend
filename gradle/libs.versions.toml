[versions]
kotlin = "2.0.21"
# F6 (ROJAN_BACKEND_SECURITY_AUDIT_v1.md, GHSA-rc42-6c7j-7h5r): 3.3.13 is the
# latest, and last ever published, 3.3.x release (confirmed against Maven
# Central's own metadata - the 3.3.x line is fully EOL) - fixes
# EndpointRequest.to()'s wrong-matcher bug, patched at 3.3.11. Same-minor-
# line patch bump, not a framework migration.
springBoot = "3.3.13"
springDependencyManagement = "1.1.6"
#  F12 (ROJAN_BACKEND_SECURITY_AUDIT_v1.md): 2.6.0 kept, reverted back from 2 real
#  attempts (2.10.0, then 2.7.0 - Pass 33). Both fail identically: NoClassDefFoundError/
#  ClassNotFoundException on org.springframework.web.servlet.resource.
#  LiteWebJarsResourceResolver, a class that does not exist in Spring Framework 6.1.21
#  (this project's current line). This is not a Jackson-version question at all - no
#  springdoc release past 2.6.x supports Spring Framework 6.1.x, confirmed by the same
#  failure recurring at two different springdoc versions. F12 genuinely needs the same
#  Spring Boot 3.4.x/3.5.x+ migration already blocking F1/F4/F7/F8-F11 - not a smaller,
#  independently-fixable item.
springdoc = "2.6.0"
jjwt = "0.12.6"
junit = "5.11.3"
mockk = "1.13.13"
zonkyEmbeddedDatabase = "2.8.0"
zonkyEmbeddedPostgres = "2.2.2"
zonkyPostgresBinaries = "16.14.0"
commonsCompress = "1.28.0"
commonsLang3 = "3.18.0"
zxing = "3.5.3"
awsSdk = "2.28.11"

[libraries]
# Kotlin
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }
jackson-module-kotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin" }

# Spring Boot starters (versions resolved via spring-boot-dependencies BOM)
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-data-redis = { module = "org.springframework.boot:spring-boot-starter-data-redis" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
micrometer-registry-prometheus = { module = "io.micrometer:micrometer-registry-prometheus" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-starter-security-test = { module = "org.springframework.security:spring-security-test" }
spring-kafka = { module = "org.springframework.kafka:spring-kafka" }
spring-kafka-test = { module = "org.springframework.kafka:spring-kafka-test" }

# Servlet API — provided at runtime by the web starter's embedded Tomcat
# (spring-security-web declares it `provided`, so it doesn't flow transitively)
jakarta-servlet-api = { module = "jakarta.servlet:jakarta.servlet-api" }

# Persistence
postgresql = { module = "org.postgresql:postgresql" }
flyway-core = { module = "org.flywaydb:flyway-core" }
flyway-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }

# QR code generation (salon activation flow - printable QR for reception counter)
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }
zxing-javase = { module = "com.google.zxing:javase", version.ref = "zxing" }

# Media storage (Phase 1, Media Foundation) - AWS SDK v2's S3 client speaks
# the S3 API any S3-compatible provider implements (MinIO today, real S3 or
# another provider later) via a custom endpoint override - one client
# library for every provider MediaStoragePort might ever be pointed at.
aws-s3 = { module = "software.amazon.awssdk:s3", version.ref = "awsSdk" }

# JWT
jjwt-api = { module = "io.jsonwebtoken:jjwt-api", version.ref = "jjwt" }
jjwt-impl = { module = "io.jsonwebtoken:jjwt-impl", version.ref = "jjwt" }
jjwt-jackson = { module = "io.jsonwebtoken:jjwt-jackson", version.ref = "jjwt" }

# OpenAPI
springdoc-openapi = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }

# Test
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
# TestRestTemplate auto-detects and prefers this over the JDK's default
# HttpURLConnection-based client, which has a long-standing bug throwing
# HttpRetryException on 401 responses to a streamed POST body.
apache-httpclient5 = { module = "org.apache.httpcomponents.client5:httpclient5" }

# Integration tests: a real (embedded, no-Docker) PostgreSQL, since this
# environment has no Docker daemon for Testcontainers. Reuses the same
# actual PostgreSQL binaries mechanism proven out for local manual
# verification (see README's "Environment gotcha" note).
zonky-embedded-database-spring-test = { module = "io.zonky.test:embedded-database-spring-test", version.ref = "zonkyEmbeddedDatabase" }
# The Spring integration above only wires providers in; the ZONKY (native,
# no-Docker) provider implementation itself is this separate artifact.
zonky-embedded-postgres = { module = "io.zonky.test:embedded-postgres", version.ref = "zonkyEmbeddedPostgres" }
zonky-postgres-binaries-windows-amd64 = { module = "io.zonky.test.postgres:embedded-postgres-binaries-windows-amd64", version.ref = "zonkyPostgresBinaries" }
# Spring Boot's BOM pins an older commons-compress than embedded-postgres's
# tar/xz extraction needs (NoSuchMethodError on TarArchiveEntry at runtime);
# override it explicitly for the test classpath.
commons-compress = { module = "org.apache.commons:commons-compress", version.ref = "commonsCompress" }
# commons-compress 1.28.0 in turn needs commons-lang3 >=3.18, but springdoc
# pulls in 3.14 which otherwise wins conflict resolution — override too.
commons-lang3 = { module = "org.apache.commons:commons-lang3", version.ref = "commonsLang3" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
kotlin-jpa = { id = "org.jetbrains.kotlin.plugin.jpa", version.ref = "kotlin" }
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "springDependencyManagement" }
