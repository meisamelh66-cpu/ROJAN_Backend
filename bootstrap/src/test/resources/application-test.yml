# "test" profile overrides, layered on top of the main application.yml
# (activated via @ActiveProfiles("test") — a same-named application.yml
# here would replace the base file instead of layering over it, which is
# not what we want since it also carries the kafka/redis property defaults).
# The embedded database (io.zonky.test) replaces the datasource bean
# regardless of the configured URL, so datasource properties don't need
# overriding here — only the JWT secret, which main's application.yml
# deliberately has no default for.
rojan:
  security:
    jwt:
      secret: "integration-test-only-signing-key-not-for-production-1234567890"
    # Phase 1.1 Auth API Rate Limiting: the integration test suite runs
    # dozens of /auth/register + /auth/login calls from one caller IP
    # (localhost) across many unrelated test classes (each registering its
    # own fixture user as setup) within a single test run - the production
    # defaults in application.yml would otherwise trip against normal test
    # volume, not abuse. Loosened here the same way jwt.secret above is
    # test-specific; window lengths are left at the production defaults
    # since only the *volume* differs in tests, not the time semantics.
    auth:
      login-limit-per-email-window: 10000
      login-limit-per-ip-window: 10000
      register-limit-per-ip-window: 10000
      refresh-limit-per-ip-window: 10000
    # Same reasoning as auth above, for the OTP vertical slice's own
    # integration test (OtpAuthenticationFlowIntegrationTest) — production
    # defaults (3 requests / 10 phone-min, 10 requests / ip-hour) would
    # otherwise trip against normal test volume, not abuse.
    otp:
      request-limit-per-phone-short-window: 10000
      request-limit-per-phone-long-window: 10000
      request-limit-per-ip-long-window: 10000
      verify-limit-per-phone-window: 10000
