spring:
  application:
    name: rojan-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:rojan}
    username: ${DB_USERNAME:rojan}
    password: ${DB_PASSWORD:rojan}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  # Salon Identity Foundation Phase A: bounds multipart media uploads.
  # Must stay >= rojan.media.max-file-size-bytes below - Spring rejects an
  # oversized request before UploadMediaUseCase ever runs, so this is the
  # outer bound and that property is the one that produces a clean
  # MediaFileTooLargeException instead of a raw servlet-level error.
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

# No default secret on purpose: startup must fail loudly if JWT_SECRET is
# unset rather than silently signing tokens with a known/weak key.
rojan:
  security:
    # Explicit allow-list only, never a wildcard - see CorsConfig.kt. Dev
    # default matches the ROJAN_Web Next.js dev server; production overrides
    # this in application-prod.yml.
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
    jwt:
      secret: ${JWT_SECRET:}
      issuer: ${JWT_ISSUER:rojan-ai-backend}
      access-token-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:15}
      refresh-token-ttl-days: ${JWT_REFRESH_TTL_DAYS:30}
    # Phase 1.1 Auth API Rate Limiting: /auth/login, /auth/register,
    # /auth/refresh - same env-var-overridable, config-not-code convention
    # as the otp block below.
    auth:
      login-limit-per-email-window: ${AUTH_LOGIN_LIMIT_PER_EMAIL_WINDOW:5}
      login-limit-per-ip-window: ${AUTH_LOGIN_LIMIT_PER_IP_WINDOW:20}
      login-window-seconds: ${AUTH_LOGIN_WINDOW_SECONDS:300}
      register-limit-per-ip-window: ${AUTH_REGISTER_LIMIT_PER_IP_WINDOW:5}
      register-window-seconds: ${AUTH_REGISTER_WINDOW_SECONDS:3600}
      refresh-limit-per-ip-window: ${AUTH_REFRESH_LIMIT_PER_IP_WINDOW:30}
      refresh-window-seconds: ${AUTH_REFRESH_WINDOW_SECONDS:300}
    otp:
      code-length: ${OTP_CODE_LENGTH:4}
      ttl-seconds: ${OTP_TTL_SECONDS:120}
      max-attempts: ${OTP_MAX_ATTEMPTS:5}
      resend-cooldown-seconds: ${OTP_RESEND_COOLDOWN_SECONDS:60}
      request-limit-per-phone-short-window: ${OTP_REQUEST_LIMIT_PER_PHONE_SHORT_WINDOW:3}
      request-short-window-seconds: ${OTP_REQUEST_SHORT_WINDOW_SECONDS:600}
      request-limit-per-phone-long-window: ${OTP_REQUEST_LIMIT_PER_PHONE_LONG_WINDOW:5}
      request-long-window-seconds: ${OTP_REQUEST_LONG_WINDOW_SECONDS:3600}
      request-limit-per-ip-long-window: ${OTP_REQUEST_LIMIT_PER_IP_LONG_WINDOW:10}
      verify-limit-per-phone-window: ${OTP_VERIFY_LIMIT_PER_PHONE_WINDOW:10}
      verify-window-seconds: ${OTP_VERIFY_WINDOW_SECONDS:600}

  # Salon Identity Foundation Phase A. storage-root must match wherever the
  # deployment mounts persistent storage - see MediaProperties.kt's own doc
  # comment and docker-compose.prod.yml's uploads volume.
  media:
    storage-root: ${MEDIA_STORAGE_ROOT:/app/uploads}
    max-file-size-bytes: ${MEDIA_MAX_FILE_SIZE_BYTES:5242880}
    allowed-mime-types: ${MEDIA_ALLOWED_MIME_TYPES:image/jpeg,image/png,image/webp}

# SMS Provider Integration: no defaults on purpose, same as JWT_SECRET above
# - startup must fail loudly if these are unset, rather than silently
# booting with an SMS integration that can never actually deliver a code.
# Only bound outside the "test" profile (see SmsPropertiesConfig), so the
# test suite never needs real values here.
  sms:
    api-url: ${SMS_API_URL}
    api-key: ${SMS_API_KEY}
    sender: ${SMS_SENDER}
    # MeliPayamak Shared Pattern provider: optional, second SmsProviderPort
    # implementation, unselected by default so every existing deployment
    # (Simple adapter, above) is unaffected. `provider` needs an
    # empty-string fallback so ConditionalOnProperty can always resolve it
    # without throwing; `melipayamak.*` deliberately has NO fallback - it's
    # only ever bound (see MeliPayamakSharedPatternProviderConfig) when
    # `provider` is actually set to `melipayamak-shared`, at which point
    # both must be real values, same fail-loud posture as api-key/sender
    # above.
    provider: ${SMS_PROVIDER:}
    melipayamak:
      api-key: ${MELIPAYAMAK_API_KEY}
      body-id: ${MELIPAYAMAK_BODY_ID}

  # Media Foundation (Phase 1): S3-compatible object storage, MinIO by
  # default for local/dev - safe localhost defaults, not fail-loud like
  # sms/jwt above, since an unconfigured dev environment pointing at a
  # local MinIO container is the normal case here.
  storage:
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
    region: ${STORAGE_REGION:us-east-1}
    bucket: ${STORAGE_BUCKET:rojan-media}
    access-key: ${STORAGE_ACCESS_KEY:minioadmin}
    secret-key: ${STORAGE_SECRET_KEY:minioadmin}
    public-base-url: ${STORAGE_PUBLIC_BASE_URL:http://localhost:9000/rojan-media}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
