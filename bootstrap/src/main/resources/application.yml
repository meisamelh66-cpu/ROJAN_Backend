spring:
  application:
    name: rojan-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:rojan}
    username: ${DB_USERNAME:rojan}
    password: ${DB_PASSWORD:rojan}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

# No default secret on purpose: startup must fail loudly if JWT_SECRET is
# unset rather than silently signing tokens with a known/weak key.
rojan:
  security:
    jwt:
      secret: ${JWT_SECRET:}
      issuer: ${JWT_ISSUER:rojan-ai-backend}
      access-token-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:15}
      refresh-token-ttl-days: ${JWT_REFRESH_TTL_DAYS:30}
    # Phase 1.1 Auth API Rate Limiting: /auth/login, /auth/register,
    # /auth/refresh - same env-var-overridable, config-not-code convention
    # as the otp block below.
    auth:
      login-limit-per-email-window: ${AUTH_LOGIN_LIMIT_PER_EMAIL_WINDOW:5}
      login-limit-per-ip-window: ${AUTH_LOGIN_LIMIT_PER_IP_WINDOW:20}
      login-window-seconds: ${AUTH_LOGIN_WINDOW_SECONDS:300}
      register-limit-per-ip-window: ${AUTH_REGISTER_LIMIT_PER_IP_WINDOW:5}
      register-window-seconds: ${AUTH_REGISTER_WINDOW_SECONDS:3600}
      refresh-limit-per-ip-window: ${AUTH_REFRESH_LIMIT_PER_IP_WINDOW:30}
      refresh-window-seconds: ${AUTH_REFRESH_WINDOW_SECONDS:300}
    otp:
      ttl-seconds: ${OTP_TTL_SECONDS:120}
      max-attempts: ${OTP_MAX_ATTEMPTS:5}
      resend-cooldown-seconds: ${OTP_RESEND_COOLDOWN_SECONDS:60}
      request-limit-per-phone-short-window: ${OTP_REQUEST_LIMIT_PER_PHONE_SHORT_WINDOW:3}
      request-short-window-seconds: ${OTP_REQUEST_SHORT_WINDOW_SECONDS:600}
      request-limit-per-phone-long-window: ${OTP_REQUEST_LIMIT_PER_PHONE_LONG_WINDOW:5}
      request-long-window-seconds: ${OTP_REQUEST_LONG_WINDOW_SECONDS:3600}
      request-limit-per-ip-long-window: ${OTP_REQUEST_LIMIT_PER_IP_LONG_WINDOW:10}
      verify-limit-per-phone-window: ${OTP_VERIFY_LIMIT_PER_PHONE_WINDOW:10}
      verify-window-seconds: ${OTP_VERIFY_WINDOW_SECONDS:600}

# SMS Provider Integration: no defaults on purpose, same as JWT_SECRET above
# - startup must fail loudly if these are unset, rather than silently
# booting with an SMS integration that can never actually deliver a code.
# Only bound outside the "test" profile (see SmsPropertiesConfig), so the
# test suite never needs real values here.
  sms:
    api-url: ${SMS_API_URL}
    api-key: ${SMS_API_KEY}
    sender: ${SMS_SENDER}
    # MeliPayamak OTP Adapter (ROJAN_MeliPayamak_OTP_Adapter_Design_v1.md):
    # optional, second SmsProviderPort implementation, unselected by
    # default so every existing deployment is unaffected. `provider` needs
    # an empty-string fallback so ConditionalOnProperty can always resolve
    # it without throwing; `otp.*` deliberately has NO fallback - it's
    # only ever bound (see MeliPayamakOtpProviderConfig) when `provider`
    # is actually set to `melipayamak-otp`, at which point these three
    # must be real values, same fail-loud posture as api-key/sender above.
    provider: ${SMS_PROVIDER:}
    otp:
      username: ${SMS_OTP_USERNAME}
      password: ${SMS_OTP_PASSWORD}
      sender: ${SMS_OTP_SENDER}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
