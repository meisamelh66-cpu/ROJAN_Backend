# "prod" profile overrides, layered on top of the main application.yml
# (activated via SPRING_PROFILES_ACTIVE=prod — see docker-compose.prod.yml
# — same layering convention as application-test.yml: a same-named
# application.yml here would replace the base file instead of layering
# over it). Ops/config only, no business-logic changes — every value the
# base file already sets correctly for production (ddl-auto: validate,
# open-in-view: false, non_null Jackson inclusion, etc.) is left alone.

rojan:
  security:
    # Base application.yml defaults to the local Next.js dev server; this
    # overrides it to the real production origin. Still overridable via
    # CORS_ALLOWED_ORIGINS if a second origin is ever needed - no code
    # change required either way.
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:https://rojanai.ir}

server:
  # Lets in-flight requests finish (bounded by the timeout below) instead
  # of being cut off mid-response when Docker sends SIGTERM on
  # `docker compose stop`/a rolling restart.
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s

management:
  endpoint:
    health:
      # Base application.yml uses "when-authorized" (full details only to
      # an authenticated caller). In prod, no endpoint-specific actuator
      # role is configured, so "authorized" reduces to "any authenticated
      # user" — tighter default here: never leak DB/disk/component detail
      # in the response body, regardless of auth. /actuator/health still
      # reports overall UP/DOWN either way (used by docker-compose.prod.yml's
      # and Nginx's healthchecks).
      show-details: never
  health:
    kafka:
      # This deployment's docker-compose.prod.yml deliberately has no
      # Kafka service (see that file's comment) — the app's Kafka
      # producer bean is real but unused (README: "no topic in use yet"),
      # connecting lazily against spring.kafka.bootstrap-servers' own
      # default (localhost:9092, unreachable here). Without this,
      # Spring Boot's auto-configured Kafka health indicator would ping
      # that unreachable broker and drag the whole /actuator/health
      # response to DOWN even though every real dependency (Postgres,
      # Redis) is healthy — which would make docker-compose.prod.yml's
      # and Nginx's healthchecks falsely report the app as unhealthy.
      # Re-enable the moment Kafka is actually deployed alongside this
      # stack.
      enabled: false

# springdoc/Swagger UI stays available in dev (the base application.yml) but
# is switched off in prod - publicly documenting/exploring the full API
# surface isn't something a production deployment should expose by
# default. Toggle back on via SPRINGDOC_ENABLED=true if a specific
# deployment needs it reachable (e.g. behind additional auth).
springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}

logging:
  level:
    root: WARN
    ai.rojan.backend: INFO
  # Written in addition to the console/stdout Spring Boot already logs to
  # (so `docker compose logs app` keeps working) — this path is
  # bind-mounted to /opt/rojan/logs by docker-compose.prod.yml, so log
  # history survives container recreation and is directly readable on the
  # host without going through Docker at all.
  file:
    name: /app/logs/rojan-backend.log
  logback:
    rollingpolicy:
      max-file-size: 50MB
      max-history: 14
      total-size-cap: 1GB
